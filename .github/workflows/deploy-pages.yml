name: Deploy to Cloudflare Pages

# Every deploy refreshes the EIA snapshots first, validates them, and publishes the
# result straight to Cloudflare Pages. Nothing is committed or pushed; the refreshed
# snapshots are kept as a workflow artifact for anyone who wants to commit them via a PR.
#
# Manual only: releases run on a local launchd agent instead (scripts/local-deploy/, README
# "Local CI and release"), because GitHub Actions minutes are not used for this private repo.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch fresh EIA data before deploying (off = deploy committed snapshots)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-pages
      url: https://map.cujuju.foo
    env:
      PAGES_PROJECT: electricity-map
      SITE_URL: https://map.cujuju.foo/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Refresh EIA snapshots
        if: github.event_name != 'workflow_dispatch' || inputs.refresh
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY || 'DEMO_KEY' }}
        run: |
          if [ "$EIA_API_KEY" = DEMO_KEY ]; then
            echo "::warning::EIA_API_KEY secret is not set; using DEMO_KEY, which EIA rate-limits (HTTP 429) on shared runner IPs."
          fi
          npm run data:refresh

      - name: Summarize snapshot changes
        run: |
          {
            echo '### EIA snapshots'
            echo
            echo '| File | fetchedAt | Changed vs. commit |'
            echo '| --- | --- | --- |'
            for file in data/*.json; do
              fetched=$(node -p "JSON.parse(require('fs').readFileSync('$file')).fetchedAt")
              if git diff --quiet -- "$file"; then changed=no; else changed=yes; fi
              echo "| \`$file\` | $fetched | $changed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm run check
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chrome
      - name: UI tests against the Pages output
        run: |
          npx wrangler pages dev dist-pages --ip 127.0.0.1 --port 8788 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8788/api/health && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8788 npm run test:ui

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist-pages
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "${{ github.event_name }} ${{ github.run_id }}"
          --commit-dirty=true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eia-snapshots-${{ github.run_id }}
          path: data/*.json
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pages-test-results
          path: |
            test-results/
            wrangler-dev.log
          retention-days: 7
