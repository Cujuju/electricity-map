name: Check Electricity Map

# Manual only: GitHub Actions minutes are not used for this private repository.
# Run `npm run ci:local` before merging instead (see README, "Local CI and release").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/build-pages.mjs
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npx electron-builder --dir --publish never
      - run: npm run test:desktop
        env:
          ELECTRICITY_MAP_EXECUTABLE: '${{ github.workspace }}\release\win-unpacked\Electricity Map.exe'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-results
          path: test-results-desktop/
          retention-days: 7
